<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Admin{% endblock %} — Legacies Realty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="{{ url_for('admin.dashboard') }}" class="logo">
        <span class="logo-mark">LR</span>
        <span>Admin</span>
      </a>
      <nav class="admin-nav">
        <a href="{{ url_for('admin.dashboard') }}" class="{% if request.endpoint == 'admin.dashboard' %}active{% endif %}">Dashboard</a>
        <a href="{{ url_for('admin.plots') }}" class="{% if 'plot' in (request.endpoint or '') %}active{% endif %}">Plots</a>
        <a href="{{ url_for('admin.agreements') }}" class="{% if 'agreement' in (request.endpoint or '') %}active{% endif %}">Agreements</a>
        <a href="{{ url_for('admin.leads') }}" class="{% if 'lead' in (request.endpoint or '') %}active{% endif %}">Viewing requests</a>
        <a href="{{ url_for('public.home') }}" target="_blank">View website ↗</a>
        <a href="{{ url_for('admin.logout') }}">Sign out</a>
      </nav>
    </aside>
    <main class="admin-main">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
          <div class="flash flash-{{ category }}" style="margin-bottom:16px">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
