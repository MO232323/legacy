{% extends "admin/base_admin.html" %}
{% block title %}{{ "Edit plot" if plot else "Add plot" }}{% endblock %}
{% block content %}
<div class="admin-page-head">
  <h1>{{ "Edit plot" if plot else "Add plot" }} — {{ site.name }}</h1>
  <p style="color:var(--ink-muted)">{{ site.site_code }} · {{ site.city }}</p>
</div>
<form class="admin-form" method="post" style="max-width:640px">
  <div class="form-group">
    <label>Plot code *</label>
    <input type="text" name="plot_code" required value="{{ plot.plot_code if plot else '' }}" placeholder="e.g. MPEMBA-01" />
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Exact size (m²) — optional</label>
      <input type="number" name="size_sqm" min="0" value="{{ plot.size_sqm if plot and plot.size_sqm else '' }}" placeholder="e.g. 450" />
    </div>
    <div class="form-group">
      <label>Size label (flexible)</label>
      <input type="text" name="size_label" value="{{ plot.size_label if plot and plot.size_label else '' }}" placeholder="e.g. Corner plot" />
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Price (MWK)</label>
      <input type="number" name="price_mwk" min="0" value="{{ plot.price_mwk if plot and plot.price_mwk else '' }}" placeholder="e.g. 5500000" />
    </div>
    <div class="form-group">
      <label>Price type</label>
      <select name="price_is_from">
        <option value="0" {% if not plot or not plot.price_is_from %}selected{% endif %}>Fixed price</option>
        <option value="1" {% if plot and plot.price_is_from %}selected{% endif %}>Starting from</option>
      </select>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Type</label>
      <select name="plot_type">
        {% for t in ['Residential','Investment','Commercial','Mixed'] %}
        <option value="{{ t }}" {% if plot and plot.plot_type == t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Status</label>
      <select name="status">
        {% for s in ['Available','Reserved','Sold'] %}
        <option value="{{ s }}" {% if plot and plot.status == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">{{ "Save changes" if plot else "Add plot" }}</button>
    <a href="{{ url_for('admin.site_plots', site_id=site.id) }}" class="btn btn-outline">Cancel</a>
  </div>
</form>
{% endblock %}
